# Include INSIDE the existing HTTPS server block, after reviewing its configuration.
# Keep existing server-wide auth_basic and auth_basic_user_file enabled.
# Do not use this snippet if there is already a conflicting location = /.
# The welcome file must be readable by Nginx; no other files in this directory
# are exposed by this exact-match location.
location = / {
    auth_basic off;
    alias /srv/itstep-library/deploy/welcome/index.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
# All other locations retain their existing authentication and proxy rules.
# /accounts/login/ must remain protected by HTTP Basic Auth.
